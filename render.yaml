# Readback -- Render Blueprint
#
# One FastAPI web service and one Postgres database. The browser front end is
# NOT here: it is a static Vite build on Vercel (web/vercel.json, docs/DEPLOY.md).
#
# ---------------------------------------------------------------------------
# WHAT THIS SERVICE TALKS TO, AND IN WHICH DIRECTION
# ---------------------------------------------------------------------------
#   browser (Vercel page)  --HTTPS + WSS-->  this service               inbound
#   this service           --WSS-->          streaming.assemblyai.com   outbound
#
# Nothing at AssemblyAI ever calls us. Readback uses the Streaming API, opened
# OUTBOUND from server/stream/live.py with the key in an Authorization header.
# There is no public callback URL to configure, no server-side tool endpoint,
# and no token minted for the browser: the browser talks only to this service,
# and the key never leaves it. (The Closeout blueprint this file replaced needed
# a CLOSEOUT_PUBLIC_BASE_URL because the Voice Agent API called inbound. That
# variable has no equivalent here and must not be reintroduced.)
#
# The service still has to be public -- the page on Vercel connects to it.
#
# ---------------------------------------------------------------------------
# WEBSOCKETS
# ---------------------------------------------------------------------------
# The browser holds /api/session/{id}/live (events out) and, once it exists,
# the audio-in socket, each for up to the 150 s session cap. Render web
# services pass WebSocket upgrades through on every instance type including
# free, per Render's documentation -- NOT re-verified against an account for
# this file; see docs/DEPLOY.md "Assumptions". If an upgrade were refused the
# symptom would be a healthy /health and a console error on the wss:// URL.
#
# ---------------------------------------------------------------------------
# FREE TIER SLEEPS -- READ THIS BEFORE A DEMO
# ---------------------------------------------------------------------------
# Render's free web service instances spin down after ~15 minutes without
# traffic. The next request wakes the container: cold start is roughly 50
# seconds. For a judge or a demo audience that is indistinguishable from a
# broken app -- they click "Start", nothing happens, they leave.
#
# It is WORSE for Readback than it was for Closeout: web/src/lib/session.ts
# gives up on any request after 12 s (TIMEOUT_MS). A cold instance therefore
# does not show a slow page, it shows a "timeout" failure on the first click,
# and only the SECOND attempt a minute later works.
#
# What to do, cheapest first:
#   1. Warm it by hand. Two minutes before anyone looks, run:
#        curl https://<your-service>.onrender.com/health
#      Wait for the JSON. The service now stays up for ~15 min of idle.
#   2. Keep it warm with an external pinger. Any free uptime monitor hitting
#      /health every 10 minutes holds it open. Do NOT use Render Cron for this
#      on the free plan -- cron jobs are a paid feature, and a service pinging
#      itself does not reset the idle timer reliably.
#   3. Pay. `plan: starter` ($7/mo at time of writing) never sleeps. If the
#      demo matters more than the $7, this is the honest answer -- change the
#      `plan:` line below and redeploy.
#
# The free Postgres instance also expires (currently 30 days after creation),
# after which the database is deleted, not just stopped. For anything past a
# hackathon weekend, upgrade the database plan or move it to Neon (DEPLOY.md
# appendix).

databases:
  - name: readback-db
    databaseName: readback
    user: readback
    plan: free
    region: oregon
    # Render hands out a `postgres://` connection string. SQLAlchemy 2 rejects
    # that scheme, and a bare `postgresql://` would pick the psycopg2 driver
    # this project does not install. server/db.py normalises both spellings
    # to `postgresql+psycopg://` at the one place a URL enters the process.

services:
  - type: web
    name: readback-api
    runtime: python
    plan: free
    # Oregon because the outbound socket to streaming.assemblyai.com is the
    # latency that matters for an interrupt budget, and that endpoint is
    # US-hosted. The database above is pinned to the same region so the
    # internal connection string works.
    region: oregon
    # No rootDir: `server/` is a package at the repository root and
    # `python -m uvicorn` puts the working directory on sys.path, so the
    # deploy needs no PYTHONPATH. The replay fixtures are located from the
    # package itself (server/stream/replay.py -> tests/fixtures), which is why
    # tests/ must be committed and deployed with the code.
    # Installs the LOCK, not requirements.txt, and refuses anything whose hash
    # is not in it. requirements.txt pins nine direct dependencies and says why
    # each is there; it pinned nothing underneath them, so about twenty
    # transitive packages resolved to whatever was newest at each deploy and a
    # compromised or yanked release would have arrived without anyone looking.
    # --require-hashes makes that impossible: pip verifies every artefact
    # against requirements.lock and fails the build on a mismatch.
    #
    # pip itself is pinned for the same reason -- an unpinned `--upgrade pip`
    # is one more thing that changes under the deploy. To regenerate after a
    # dependency change, see the header of requirements.lock.
    buildCommand: "pip install --upgrade pip==24.3.1 && pip install --require-hashes -r requirements.lock"
    # 0.0.0.0 so the container accepts traffic from Render's proxy; $PORT
    # because Render assigns the port.
    #
    # --workers 1 is a correctness constraint, not a cost saving. server/main.py
    # holds every running pipeline in a module-level dict (_SESSIONS) and the
    # admission counters in module-level windows; the /live WebSocket must land
    # on the process that runs the pipeline. A second worker would answer
    # "unknown session" for half of all sessions and double every limit.
    #
    # --proxy-headers --forwarded-allow-ips="*": Render terminates TLS and
    # forwards the visitor's address in X-Forwarded-For. uvicorn only honours
    # that header from a trusted proxy address, and its default trust list is
    # 127.0.0.1 -- Render's proxy is not loopback. Without this flag every
    # visitor hashes to the proxy's address, and the per-IP admission gate
    # (3 sessions/hour, ARCH 3.11) closes for EVERYONE after the third session
    # of the hour. The wildcard is safe here because the container is only
    # reachable through Render's proxy.
    startCommand: 'python -m uvicorn server.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips="*"'
    # /health returns the deployment's shape (live_capture, replay_mode,
    # consent_required). If Settings refuses to construct -- consent off, a
    # placeholder secret next to a real key, a budget below one session --
    # the process exits before binding and this check never passes. That is
    # the intended failure: the log carries the reason, nothing serves.
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # --- the one secret a human must paste --------------------------------
      # sync:false -> Render prompts for it at Blueprint apply, stores it, and
      # it is in neither this file nor git. Held here and only here; the
      # browser never receives it (see the header of this file).
      - key: READBACK_ASSEMBLYAI_API_KEY
        sync: false

      # --- secrets nobody needs to know -------------------------------------
      # generateValue:true -> Render mints a random value once, at creation,
      # and keeps it across deploys. Both defaults in server/config.py are the
      # literal strings "dev-secret-not-for-production" and
      # "dev-salt-not-for-production", and config.py refuses to start with
      # either of them next to an API key and a non-SQLite database. If your
      # Render dashboard does not offer generateValue, set them by hand:
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      # Changing READBACK_SESSION_SECRET signs every account out -- that is
      # the intended way to do so, not a bug.
      - key: READBACK_SESSION_SECRET
        generateValue: true
      - key: READBACK_IP_HASH_SALT
        generateValue: true

      # --- database, wired from the managed instance above ------------------
      - key: READBACK_DATABASE_URL
        fromDatabase:
          name: readback-db
          property: connectionString

      # --- CORS: the browser origins allowed to call this API ---------------
      # PLACEHOLDER. Replace `readback.vercel.app` with the production domain
      # Vercel actually assigns (DEPLOY.md step 5), commit, redeploy. Comma-
      # separated, scheme included, no trailing slash. Vercel PREVIEW deploys
      # get a new hostname per commit and will not match -- add them explicitly
      # or demo from production. localhost:5173 stays so a laptop can drive the
      # deployed API. CORS governs fetch() only; the browser does not apply it
      # to WebSocket upgrades, so a wrong value breaks /api/session/start and
      # leaves the sockets looking fine.
      - key: READBACK_CORS_ORIGINS
        value: https://readback.vercel.app,http://localhost:5173

      # --- the money (ARCH 3.11) --------------------------------------------
      # Socket-seconds per UTC day, all sessions, all sockets. $0.60/hr per
      # socket = 6,000 socket-seconds per dollar. The code default is 120,000
      # ($20/day, 400 A/B sessions) -- that is a production ceiling, and over a
      # seven-day judging window it could reach $140, more than the credit the
      # ARCH assumes ($50). 36,000 is $6/day: 120 two-socket sessions or 240
      # single-socket ones per day, and a worst-case week of $42. At 100% the
      # server drops to replay; at 60% it writes a BUDGET_ALARM audit row.
      - key: READBACK_DAILY_BUDGET_SECONDS
        value: "36000"

      # --- the kill switch --------------------------------------------------
      # Flip to "true" in the dashboard to stop ALL spend immediately: every
      # session runs the recorded fixtures instead of a socket, and /health
      # says so (replay_mode: true). Nothing else changes. It beats a present
      # key by construction -- tests/test_pipeline_e2e.py asserts that.
      - key: READBACK_REPLAY_MODE
        value: "false"

      # Consent is NOT listed on purpose. READBACK_CONSENT_REQUIRED defaults to
      # true and config.py refuses false unless replay_mode is also true. Do
      # not add it here (ARCH 3.12).

      - key: READBACK_LOG_LEVEL
        value: INFO

      # --- runtime ----------------------------------------------------------
      # 3.12 is in its security-fixes-only phase, so every patch release IS a
      # security release: 3.12.9 (Feb 2025) was seven behind. Bump this when
      # python.org lists a newer 3.12.x -- same minor, so the hashed lock holds.
      - key: PYTHON_VERSION
        value: "3.12.16"
      # Unbuffered stdout, so uvicorn's logs reach the Render log tail as they
      # happen rather than in blocks when the buffer flushes.
      - key: PYTHONUNBUFFERED
        value: "1"
